name: Validate CPU logprob precision repository hooks
on:
  push:
    branches: [validation/cpu-logprob-precision-style-20261113]
permissions:
  contents: read
jobs:
  style:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Ruff checks
        id: check
        continue-on-error: true
        run: uvx ruff==0.17.2 check --diff vllm/v1/worker/cpu/logprob.py tests/v1/worker/cpu/test_cpu_logprob.py
      - name: Ruff formatting
        id: format
        continue-on-error: true
        run: uvx ruff==0.17.2 format --diff vllm/v1/worker/cpu/logprob.py tests/v1/worker/cpu/test_cpu_logprob.py
      - name: Run applicable repository pre-commit hooks
        if: always()
        id: hooks
        continue-on-error: true
        run: |
          uvx pre-commit run --files vllm/v1/worker/cpu/logprob.py tests/v1/worker/cpu/test_cpu_logprob.py docs/models/generative_models.md
          git diff --exit-code
      - name: Require both checks
        run: |
          test "${{ steps.check.outcome }}" = success
          test "${{ steps.format.outcome }}" = success
          test "${{ steps.hooks.outcome }}" = success
