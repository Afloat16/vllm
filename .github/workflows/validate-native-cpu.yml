name: Validate native NumPy multimodal embedding byte order
on:
  push:
    branches: [validation/native-cpu-environment-20261112]
permissions:
  contents: read
jobs:
  native-numpy-mm:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VLLM_TARGET_DEVICE: cpu
      PYTHONFAULTHANDLER: "1"
      VLLM_CPU_OMP_THREADS_BIND: nobind
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      OMP_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 64
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install CPU shared libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libnuma-dev libtcmalloc-minimal4
      - name: Restore the exact base native CPU runtime
        uses: actions/cache/restore@v4
        with:
          path: |
            .venv
            vllm/*.so
            vllm/libs
          key: vllm-native-191e5d5d-py312-torch214-ubuntu24-v1
          fail-on-cache-miss: true
      - name: Install standard test dependencies
        run: uv pip install --python .venv/bin/python tblib anthropic pytest pytest-asyncio jsonschema
      - name: Check NumPy embeddings and native Llava before and after
        run: |
          source .venv/bin/activate
          IOMP_PATH=$(rg --files --hidden --no-ignore .venv | rg '/libiomp5.so$' | head -1)
          TC_PATH=$(ldconfig -p | awk '/libtcmalloc_minimal.so.4 / {print $NF; exit}')
          if [ -n "$IOMP_PATH" ]; then export LD_PRELOAD="$TC_PATH:$PWD/$IOMP_PATH${LD_PRELOAD:+:$LD_PRELOAD}"; fi
          python validation/run_numpy_mm_native.py
      - name: Record native host resources
        if: always()
        run: |
          lscpu
          free -m
          if [ -r /sys/fs/cgroup/memory.events ]; then cat /sys/fs/cgroup/memory.events; fi
      - name: Save native model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-numpy-mm-checkpoint-9199802eb3
          path: |
            numpy_mm_before.log
            numpy_mm_before.xml
            numpy_mm_after.log
            numpy_mm_after.xml
            numpy_mm_existing.log
            numpy_mm_existing.xml
            numpy_mm_validation_result.json
