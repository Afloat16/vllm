name: Validate standalone ARM CPU token logprob precision
on:
  push:
    branches: [validation/native-arm-logprob-20261113]
permissions:
  contents: read
jobs:
  native-cpu:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      VLLM_TARGET_DEVICE: cpu
      MAX_JOBS: '2'
      CCACHE_DIR: /home/runner/.cache/vllm-ccache
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      VLLM_CPU_OMP_THREADS_BIND: nobind
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Install CPU compiler and libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-12 g++-12 libnuma-dev libtcmalloc-minimal4 ccache
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/vllm-ccache
          key: vllm-arm-191e5d5d-gcc12-${{ github.run_id }}
          restore-keys: vllm-arm-191e5d5d-gcc12-
      - uses: actions/cache/restore@v4
        id: native_runtime
        with:
          path: |
            .venv
            vllm/*.so
            vllm/libs
          key: vllm-native-arm-191e5d5d-py312-torch214-ubuntu24-v1
      - name: Install the official CPU build dependencies
        if: steps.native_runtime.outputs.cache-hit != 'true'
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -r requirements/build/cpu.txt -r requirements/cpu.txt --torch-backend cpu --index-strategy unsafe-best-match
          uv pip install --python .venv/bin/python pytest pytest-asyncio pandas datasets tblib anthropic jsonschema
      - name: Build the current native CPU runtime
        id: native_build
        if: steps.native_runtime.outputs.cache-hit != 'true'
        env:
          CC: gcc-12
          CXX: g++-12
        run: uv pip install --python .venv/bin/python --editable . --no-build-isolation --verbose
      - name: Save the successful native runtime
        if: steps.native_build.outcome == 'success' && steps.native_runtime.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .venv
            vllm/*.so
            vllm/libs
          key: vllm-native-arm-191e5d5d-py312-torch214-ubuntu24-v1
      - name: Save compiler cache after building
        if: always() && steps.native_build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/vllm-ccache
          key: vllm-arm-191e5d5d-gcc12-build-${{ github.run_id }}
      - name: Check ARM standalone native logprobs before and after
        run: |
          TC_PATH=$(ldconfig -p | awk '/libtcmalloc_minimal.so.4 / {print $NF; exit}')
          export LD_PRELOAD="$TC_PATH${LD_PRELOAD:+:$LD_PRELOAD}"
          .venv/bin/python validation/run_cpu_logprob_precision.py
      - name: Record native host resources
        if: always()
        run: |
          lscpu
          free -m
          if [ -r /sys/fs/cgroup/memory.events ]; then cat /sys/fs/cgroup/memory.events; fi
      - name: Save ARM native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm-cpu-logprob-evidence
          path: |
            cpu_logprob_before.log
            cpu_logprob_before.xml
            cpu_logprob_after.log
            cpu_logprob_after.xml
            cpu_logprob_existing.log
            cpu_logprob_existing.xml
            cpu_logprob_validation_result.json
